{% extends 'userbase.html' %}
{% load static %}
{% block main %}
<div class="page-wrapper">
    <div class="page-content-wrapper">
        <div class="page-content">
            <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
                <div class="breadcrumb-title pe-3">Change Password</div>
                <div class="ps-3">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0 p-0">
                            <li class="breadcrumb-item"><a href="{% url 'user_home' %}"><i class="bx bx-home-alt"></i></a></li>
                            <li class="breadcrumb-item active" aria-current="page">Change Password</li>
                        </ol>
                    </nav>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6 mx-auto">
                    <div class="card">
                        <div class="card-body">
                            <div class="nf-card-head">
                                <span class="nf-icon-badge"><i class="bx bx-lock-alt"></i></span>
                                <div class="card-title mb-0"><h4 class="mb-0">Change Password</h4></div>
                            </div>
                            <hr>
                            <form method="post" name="changepassword" class="nf-loading-form" novalidate onsubmit="return checkpassword()">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label class="form-label">Current Password</label>
                                    <input type="password" name="oldpassword" placeholder="Enter Current Password"
                                        class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">New Password</label>
                                    <input type="password" name="newpassword" placeholder="Enter New Password"
                                        class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" name="confirmpassword" placeholder="Enter Confirm Password"
                                        class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <button type="submit" class="btn btn-primary px-5">Submit</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function checkpassword() {
        if (document.changepassword.newpassword.value != document.changepassword.confirmpassword.value) {
            nfToast('New password and confirm password do not match.', 'error');
            document.changepassword.confirmpassword.focus();
            return false;
        }
        return true;
    }
</script>

{% if error == "no" %}
<script>nfToast('Password updated successfully.', 'success', { redirect: '{% url 'logout' %}' });</script>
{% endif %}
{% if error == "yes" or error == "not" %}
<script>nfToast('{{ error_message|default:"Something went wrong."|escapejs }}', 'error');</script>
{% endif %}
{% endblock %}
