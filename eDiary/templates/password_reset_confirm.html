{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose new password — eDiary</title>
  <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/icons.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/nf-theme.css' %}" />
</head>
<body class="nf-auth">
  <div class="nf-auth-shell">
    <nav class="nf-auth-nav"><a href="{% url 'index' %}" class="nf-brand">eDiary</a></nav>
    <div class="nf-auth-panel">
      {% if not valid %}
      <h1 style="font-size:1.4rem !important;">Link invalid or expired</h1>
      <p class="nf-auth-meta"><a href="{% url 'password_reset' %}">Request a new reset link</a></p>
      {% else %}
      <h1 style="font-size:1.4rem !important;">Set a new password</h1>
      <form method="post" class="row g-3 nf-loading-form" novalidate>
        {% csrf_token %}
        <div class="col-12">
          <label class="form-label">New password</label>
          <input type="password" name="password" class="form-control" minlength="8" required>
        </div>
        <div class="col-12">
          <label class="form-label">Confirm password</label>
          <input type="password" name="confirm" class="form-control" minlength="8" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Update password</button>
        </div>
      </form>
      {% endif %}
    </div>
  </div>
  <script src="{% static 'assets/js/nf-ui.js' %}"></script>
  {% if error == "yes" %}
  <script>nfToast('{{ error_message|escapejs }}', 'error');</script>
  {% endif %}
</body>
</html>
