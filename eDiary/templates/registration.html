{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	<title>Sign Up — eDiary</title>
	<link rel="icon" href="{% static 'assets/images/logo-icon.png' %}" type="image/png" />
	<link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}" />
	<link rel="stylesheet" href="{% static 'assets/css/icons.css' %}" />
	<link rel="stylesheet" href="{% static 'assets/css/nf-theme.css' %}" />
</head>
<body class="nf-auth">
	<div class="nf-orb nf-orb-1"></div>
	<div class="nf-orb nf-orb-3"></div>
	<div class="nf-auth-shell">
		<nav class="nf-auth-nav">
			<a href="{% url 'index' %}" class="nf-brand">eDiary</a>
			<a href="{% url 'user_login' %}" class="btn btn-nf-signin">Sign In</a>
		</nav>
		<div class="nf-auth-panel" style="max-width:520px;">
			<div class="nf-card-head mb-3">
				<span class="nf-icon-badge purple"><i class="bx bx-user-plus"></i></span>
				<h1 class="mb-0" style="font-size:1.75rem !important;">Join eDiary</h1>
			</div>
			<form method="post" class="row g-3">
				{% csrf_token %}
				<div class="col-sm-6">
					<label class="form-label">First Name</label>
					<input type="text" name="firstName" class="form-control" placeholder="First name" required>
				</div>
				<div class="col-sm-6">
					<label class="form-label">Last Name</label>
					<input type="text" name="lastName" class="form-control" placeholder="Last name" required>
				</div>
				<div class="col-12">
					<label class="form-label">Email Address</label>
					<input type="email" name="emailid" class="form-control" placeholder="example@gmail.com" required>
				</div>
				<div class="col-12">
					<label class="form-label">Password</label>
					<input type="password" name="Password" class="form-control" placeholder="Create a password" required>
				</div>
				<div class="col-12">
					<label class="form-label">Contact Number</label>
					<input type="text" name="mobileNumber" class="form-control" placeholder="1234567890" maxlength="10" required>
				</div>
				<div class="col-12">
					<button type="submit" class="btn btn-primary"><i class="bx bx-rocket"></i> Create Account</button>
				</div>
			</form>
			<p class="nf-auth-meta">Already have an account? <a href="{% url 'user_login' %}">Sign in</a></p>
		</div>
	</div>
	<script src="{% static 'assets/js/nf-ui.js' %}"></script>
	{% if error == "no" %}
	<script>nfToast('Registration successful', 'success', { redirect: '{% url 'user_login' %}' });</script>
	{% endif %}
	{% if error == "yes" %}
	<script>nfToast('Something went wrong. Please try again.', 'error');</script>
	{% endif %}
</body>
</html>
