{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="eDiary — organize categories and notes in a dark cinematic workspace." />
    <title>eDiary Management System</title>
    <link rel="icon" href="{% static 'assets/images/logo-icon.png' %}" type="image/png" />
    <link href="{% static 'assets/plugins/metismenu/css/metisMenu.min.css' %}" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/icons.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/app.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/nf-theme.css' %}" />
    {% if ga_measurement_id %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_measurement_id }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ ga_measurement_id }}');
    </script>
    {% endif %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="wrapper">
        <div class="sidebar-wrapper">
            <div class="sidebar-header">
                <a href="{% url 'index' %}" class="nf-brand">eDiary</a>
                <a href="javascript:;" class="toggle-btn" aria-label="Toggle menu"><i class="bx bx-menu"></i></a>
            </div>
            <ul class="metismenu" id="menu">
                <li>
                    <a href="{% url 'index' %}">
                        <div class="parent-icon"><i class="bx bx-home-heart"></i></div>
                        <div class="menu-title">Home</div>
                    </a>
                </li>
                <li>
                    <a href="{% url 'user_login' %}">
                        <div class="parent-icon"><i class="bx bx-log-in-circle"></i></div>
                        <div class="menu-title">Login</div>
                    </a>
                </li>
                <li>
                    <a href="{% url 'registration' %}">
                        <div class="parent-icon"><i class="bx bx-user-plus"></i></div>
                        <div class="menu-title">Register</div>
                    </a>
                </li>
            </ul>
        </div>

        <header class="top-header">
            <nav class="navbar navbar-expand">
                <div class="left-topbar d-flex align-items-center">
                    <a href="javascript:;" class="toggle-btn" aria-label="Toggle menu"><i class="bx bx-menu"></i></a>
                </div>
                <div class="flex-grow-1">
                    <p class="nf-topbar-title text-center mb-0">Your digital diary workspace</p>
                </div>
                <div class="right-topbar ms-auto">
                    <a class="btn btn-nf-signin" href="{% url 'user_login' %}">Sign In</a>
                </div>
            </nav>
        </header>

        {% block main %}{% endblock %}

        <div class="overlay toggle-btn-mobile"></div>
        <a href="javascript:;" class="back-to-top" aria-label="Back to top"><i class="bx bxs-up-arrow-alt"></i></a>
        <div class="footer">
            <p class="mb-0">e-Diary &copy; <script>document.write(new Date().getFullYear());</script> —
              <a href="{% url 'privacy' %}">Privacy</a> · <a href="{% url 'terms' %}">Terms</a>
            </p>
        </div>
    </div>

    <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'assets/js/jquery.min.js' %}"></script>
    <script src="{% static 'assets/plugins/metismenu/js/metisMenu.min.js' %}"></script>
    <script src="{% static 'assets/js/app.js' %}"></script>
    <script src="{% static 'assets/js/nf-ui.js' %}"></script>
</body>
</html>
