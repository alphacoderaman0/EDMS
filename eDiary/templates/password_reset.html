{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Reset your eDiary password" />
  <title>Reset password — eDiary</title>
  <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/icons.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/nf-theme.css' %}" />
</head>
<body class="nf-auth">
  <div class="nf-auth-shell">
    <nav class="nf-auth-nav">
      <a href="{% url 'index' %}" class="nf-brand">eDiary</a>
      <a href="{% url 'user_login' %}" class="btn btn-nf-signin">Sign In</a>
    </nav>
    <div class="nf-auth-panel">
      <div class="nf-card-head mb-3">
        <span class="nf-icon-badge"><i class="bx bx-key"></i></span>
        <h1 class="mb-0" style="font-size:1.5rem !important;">Reset password</h1>
      </div>
      <p style="color:var(--nf-ink-soft);font-size:0.9rem;">Enter your account email. If it exists, we will send a reset link.</p>
      <form method="post" class="row g-3 nf-loading-form" novalidate>
        {% csrf_token %}
        <div class="col-12">
          <label class="form-label" for="email">Email</label>
          <input id="email" type="email" name="email" class="form-control" placeholder="you@email.com" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary"><i class="bx bx-envelope"></i> Send reset link</button>
        </div>
      </form>
      <p class="nf-auth-meta"><a href="{% url 'user_login' %}">Back to Sign In</a></p>
    </div>
  </div>
  <script src="{% static 'assets/js/nf-ui.js' %}"></script>
  {% if error == "no" %}
  <script>nfToast('If that email is registered, a reset link has been sent.', 'success');</script>
  {% endif %}
  {% if error == "yes" or error == "rate" %}
  <script>nfToast('{{ error_message|escapejs }}', 'error');</script>
  {% endif %}
</body>
</html>
