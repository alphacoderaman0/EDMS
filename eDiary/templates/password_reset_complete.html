{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password updated — eDiary</title>
  <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/icons.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/nf-theme.css' %}" />
</head>
<body class="nf-auth">
  <div class="nf-auth-shell">
    <nav class="nf-auth-nav"><a href="{% url 'index' %}" class="nf-brand">eDiary</a></nav>
    <div class="nf-auth-panel text-center">
      <div class="nf-icon-badge green mx-auto mb-3"><i class="bx bx-check"></i></div>
      <h1 style="font-size:1.4rem !important;">Password updated</h1>
      <a class="btn btn-primary mt-3" href="{% url 'user_login' %}">Sign In</a>
    </div>
  </div>
  <script src="{% static 'assets/js/nf-ui.js' %}"></script>
  <script>nfToast('Your password has been updated.', 'success');</script>
</body>
</html>
