{% extends 'userbase.html' %}
{% load static %}
{% block main %}
<div class="page-wrapper">
    <div class="page-content-wrapper">
        <div class="page-content">
            <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
                <div class="breadcrumb-title pe-3">Notes</div>
                <div class="ps-3">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0 p-0">
                            <li class="breadcrumb-item"><a href="{% url 'user_home' %}"><i class="bx bx-home-alt"></i></a></li>
                            <li class="breadcrumb-item active" aria-current="page">Edit Notes</li>
                        </ol>
                    </nav>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-8 mx-auto">
                    <div class="card">
                        <div class="card-body">
                            <div class="nf-card-head">
                                <span class="nf-icon-badge cyan"><i class="bx bx-edit"></i></span>
                                <div class="card-title mb-0"><h4 class="mb-0">Edit Notes</h4></div>
                            </div>
                            <hr>
                            <form method="post">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label class="form-label">Category Name</label>
                                    <select name="category" class="form-control" required>
                                        <option value="{{ notes.category.id }}">{{ notes.category.categoryName }}</option>
                                        {% for i in category %}
                                        <option value="{{ i.id }}">{{ i.categoryName }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Notes Title</label>
                                    <input type="text" name="noteTitle" class="form-control"
                                        value="{{ notes.noteTitle }}">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Notes Description</label>
                                    <textarea name="noteDescription" class="form-control">{{ notes.noteDescription }}</textarea>
                                </div>
                                <div class="mb-3">
                                    <button type="submit" class="btn btn-primary px-5">Update</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% if error == "no" %}
<script>nfToast('Note has been updated.', 'success', { redirect: '{% url 'manageNotes' %}' });</script>
{% endif %}
{% if error == "yes" %}
<script>nfToast('Something went wrong. Please try again.', 'error');</script>
{% endif %}
{% endblock %}
